<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For Reetha ❤️</title>

<!-- Elegant handwriting fonts (Google Fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   🎨 CUSTOMIZE COLORS HERE — luxury romantic palette
   ============================================================ */
:root{
  --burgundy:      #3a0a1c;
  --burgundy-deep: #22040f;
  --burgundy-soft: #5c1230;
  --rose:          #e75480;
  --pink:          #ff9fb8;
  --pink-soft:     #ffd1dc;
  --gold:          #d9b06a;
  --gold-light:    #f5ddb0;
  --ivory:         #fff8ee;
  --paper:         #fdf6e9;
  --glass:         rgba(255, 255, 255, 0.07);
  --glass-border:  rgba(245, 221, 176, 0.25);
}

*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body{
  height:100%;
  overflow:hidden;
  font-family:'Cormorant Garamond', serif;
  background: radial-gradient(ellipse at 50% 30%, var(--burgundy-soft) 0%, var(--burgundy) 45%, var(--burgundy-deep) 100%);
  color: var(--ivory);
}

/* Cinematic vignette over everything */
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:5;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
}

/* ============================================================
   SCENES — fade between them
   ============================================================ */
.scene{
  position:fixed; inset:0; z-index:10;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:24px;
  opacity:0; visibility:hidden;
  transition: opacity 1.1s ease, visibility 1.1s;
}
.scene.active{ opacity:1; visibility:visible; }

/* ============================================================
   🔐 SCENE 1 — OPENING SCREEN
   ============================================================ */
#fx-canvas{ position:fixed; inset:0; z-index:1; pointer-events:none; }

.intro-kicker{
  font-size:clamp(0.85rem, 2.5vw, 1.1rem);
  letter-spacing:0.45em; text-transform:uppercase;
  color:var(--gold-light); opacity:0.85; margin-bottom:22px;
  animation: fadeDown 1.6s ease 0.4s both;
}
.intro-title{
  font-family:'Great Vibes', cursive;
  font-size:clamp(2.6rem, 9vw, 5.5rem);
  line-height:1.15;
  background:linear-gradient(120deg, var(--pink-soft), var(--rose) 45%, var(--gold-light));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 24px rgba(231,84,128,0.45));
  animation: fadeUp 1.8s ease 0.8s both, glowPulse 4s ease-in-out 2.5s infinite;
  padding:0 10px;
}
.intro-sub{
  font-family:'Dancing Script', cursive;
  font-size:clamp(1.2rem, 4vw, 1.8rem);
  color:var(--pink); margin-top:14px;
  animation: fadeUp 1.8s ease 1.3s both;
}
@keyframes fadeUp{ from{opacity:0; transform:translateY(26px);} to{opacity:1; transform:none;} }
@keyframes fadeDown{ from{opacity:0; transform:translateY(-20px);} to{opacity:1; transform:none;} }
@keyframes glowPulse{
  0%,100%{ filter:drop-shadow(0 0 18px rgba(231,84,128,0.35)); }
  50%{ filter:drop-shadow(0 0 40px rgba(255,159,184,0.7)); }
}

/* Glowing CTA button */
.btn-glow{
  margin-top:52px;
  font-family:'Dancing Script', cursive;
  font-size:clamp(1.25rem, 4vw, 1.7rem);
  color:var(--burgundy-deep);
  background:linear-gradient(135deg, var(--gold-light), var(--gold) 55%, #b9893f);
  border:none; border-radius:60px; padding:18px 48px;
  cursor:pointer; position:relative;
  box-shadow:0 0 30px rgba(217,176,106,0.45), 0 10px 30px rgba(0,0,0,0.4);
  animation:fadeUp 1.8s ease 1.9s both, btnBreath 2.6s ease-in-out 3s infinite;
  transition: transform .3s ease;
}
.btn-glow:hover{ transform:scale(1.06); }
.btn-glow:active{ transform:scale(0.97); }
@keyframes btnBreath{
  0%,100%{ box-shadow:0 0 22px rgba(217,176,106,0.4), 0 10px 30px rgba(0,0,0,0.4); }
  50%{ box-shadow:0 0 55px rgba(245,221,176,0.85), 0 10px 30px rgba(0,0,0,0.4); }
}

/* Ambient floating hearts (created by JS) */
.ambient-heart{
  position:fixed; bottom:-40px; z-index:2; pointer-events:none;
  color:var(--pink); text-shadow:0 0 14px rgba(255,159,184,0.9);
  animation: floatUp linear forwards;
}
@keyframes floatUp{
  from{ transform:translateY(0) rotate(-8deg); opacity:0; }
  12%{ opacity:0.85; }
  85%{ opacity:0.6; }
  to{ transform:translateY(-115vh) rotate(10deg); opacity:0; }
}

/* ============================================================
   🎁 SCENE 2 — GIFT BOX
   ============================================================ */
.gift-stage{ position:relative; perspective:1100px; animation:fadeUp 1.4s ease both; }

.gift-box{
  position:relative; width:clamp(200px, 55vw, 300px); height:auto;
  cursor:pointer; transform-style:preserve-3d;
  transition: transform .4s ease;
  animation: giftBreath 3s ease-in-out infinite;
}
.gift-box:hover{ transform:scale(1.04); }
@keyframes giftBreath{ 0%,100%{filter:drop-shadow(0 0 22px rgba(231,84,128,0.35));} 50%{filter:drop-shadow(0 0 48px rgba(255,159,184,0.75));} }

/* halo ring behind the gift */
.gift-halo{
  position:absolute; left:50%; top:58%; width:150%; padding-top:150%;
  transform:translate(-50%,-50%); border-radius:50%;
  background:radial-gradient(circle, rgba(255,159,184,0.28), transparent 62%);
  animation: haloSpin 9s linear infinite; pointer-events:none;
}
@keyframes haloSpin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }

/* box base */
.gift-base{
  position:relative; height:clamp(150px, 40vw, 220px);
  background:linear-gradient(160deg, #d6336c 0%, #a61e4d 55%, #7a1238 100%);
  border-radius:10px 10px 14px 14px;
  box-shadow:inset 0 -18px 34px rgba(0,0,0,0.35), inset 0 10px 20px rgba(255,255,255,0.12), 0 24px 50px rgba(0,0,0,0.5);
}
/* golden vertical ribbon on base */
.base-ribbon{
  position:absolute; left:50%; top:0; bottom:0; width:18%;
  transform:translateX(-50%);
  background:linear-gradient(90deg, #b9893f, var(--gold-light) 50%, #b9893f);
  box-shadow:0 0 14px rgba(245,221,176,0.5);
}

/* light escaping when opened */
.gift-light{
  position:absolute; left:50%; bottom:92%; width:130%; height:190%;
  transform:translateX(-50%) scaleY(0); transform-origin:bottom;
  background:radial-gradient(ellipse at 50% 100%, rgba(255,240,214,0.95), rgba(255,159,184,0.5) 45%, transparent 75%);
  pointer-events:none; transition:transform 1s ease;
}
.gift-box.opened .gift-light{ transform:translateX(-50%) scaleY(1); }

/* lid */
.gift-lid{
  position:absolute; left:-7%; right:-7%; top:0; height:34%;
  background:linear-gradient(160deg, #f06595 0%, #d6336c 55%, #a61e4d 100%);
  border-radius:12px;
  box-shadow:inset 0 8px 16px rgba(255,255,255,0.28), inset 0 -8px 16px rgba(0,0,0,0.28), 0 14px 30px rgba(0,0,0,0.45);
  transform-origin:left bottom;
  transition:transform 1.15s cubic-bezier(.5,-0.2,.3,1.3), opacity .4s ease 1.3s;
  z-index:3;
}
.lid-ribbon{
  position:absolute; left:50%; top:0; bottom:0; width:18%;
  transform:translateX(-50%);
  background:linear-gradient(90deg, #b9893f, var(--gold-light) 50%, #b9893f);
  box-shadow:0 0 14px rgba(245,221,176,0.6);
}
/* golden bow */
.bow{ position:absolute; left:50%; top:-34px; width:100px; height:46px; transform:translateX(-50%); }
.bow::before, .bow::after{
  content:''; position:absolute; top:0; width:46px; height:40px;
  background:linear-gradient(135deg, var(--gold-light), #b9893f);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  box-shadow:inset 0 -6px 10px rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.35);
}
.bow::before{ left:2px;  transform:rotate(-24deg); }
.bow::after { right:2px; transform:rotate(24deg); }
.bow-knot{
  position:absolute; left:50%; top:12px; width:20px; height:20px;
  transform:translateX(-50%); border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), #a97c33);
  box-shadow:0 3px 8px rgba(0,0,0,0.4);
}
/* lid fly-open */
.gift-box.opened .gift-lid{ transform:translate(-28%, -130%) rotate(-118deg); opacity:0; }
/* box gently shakes with excitement on hover */
.gift-box:not(.opened):hover{ animation:giftBreath 3s ease-in-out infinite, giftShake .5s ease; }
@keyframes giftShake{
  0%,100%{transform:rotate(0);} 25%{transform:rotate(-2.5deg);} 75%{transform:rotate(2.5deg);}
}

.gift-hint{
  margin-top:46px; font-family:'Dancing Script', cursive;
  font-size:clamp(1.15rem, 4vw, 1.6rem); color:var(--pink);
  animation:hintPulse 2.2s ease-in-out infinite;
}
@keyframes hintPulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

/* Burst particles (hearts / sparkles / petals flying out of the box) */
.burst-p{
  position:fixed; z-index:60; pointer-events:none;
  animation:burst 1.9s cubic-bezier(.15,.6,.4,1) forwards;
  text-shadow:0 0 12px currentColor;
}
@keyframes burst{
  0%{ transform:translate(0,0) scale(.3) rotate(0deg); opacity:1; }
  75%{ opacity:1; }
  100%{ transform:translate(var(--tx), var(--ty)) scale(1.25) rotate(var(--rot)); opacity:0; }
}

/* Cinematic flash transition */
.flash{
  position:fixed; inset:0; z-index:100; pointer-events:none; opacity:0;
  background:radial-gradient(circle at 50% 45%, rgba(255,241,220,1), rgba(255,159,184,0.85) 40%, rgba(58,10,28,0) 78%);
}
.flash.go{ animation:flashGo 1.4s ease forwards; }
@keyframes flashGo{ 0%{opacity:0;} 30%{opacity:1;} 100%{opacity:0;} }

/* ============================================================
   💌 SCENE 3 — APOLOGY LETTER
   ============================================================ */
.petal-fall{
  position:fixed; top:-5vh; z-index:8; pointer-events:none;
  background:radial-gradient(circle at 30% 30%, #ffc2d4, var(--rose) 70%, #b03060);
  border-radius:85% 0 85% 0;
  box-shadow:inset -2px -3px 6px rgba(120,10,50,0.35);
  animation:fall linear forwards;
}
@keyframes fall{
  0%{ transform:translate(0,-6vh) rotate(0deg); }
  25%{ transform:translate(4vw,26vh) rotate(170deg); }
  50%{ transform:translate(-3vw,56vh) rotate(340deg); }
  75%{ transform:translate(3vw,86vh) rotate(520deg); }
  100%{ transform:translate(0,112vh) rotate(700deg); }
}

/* the paper itself — unfolds like a real letter */
.letter-paper{
  position:relative; z-index:10;
  width:min(92vw, 640px);
  max-height:82vh; overflow-y:auto;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(217,176,106,0.10), transparent 50%),
    repeating-linear-gradient(0deg, transparent 0 30px, rgba(120,80,40,0.045) 30px 31px),
    linear-gradient(160deg, #fffaf0, var(--paper) 60%, #f5e8d2);
  border-radius:6px;
  padding:clamp(34px, 7vw, 64px) clamp(24px, 6vw, 60px);
  color:#5a2340;
  box-shadow:0 30px 70px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.3),
             inset 0 0 60px rgba(217,176,106,0.10);
  transform-origin:top center;
  transform:perspective(1300px) rotateX(-86deg) translateY(-30px);
  opacity:0;
  transition:transform 1.6s cubic-bezier(.22,.9,.3,1.05), opacity .9s ease;
  scrollbar-width:thin;
}
.letter-paper.unfolded{ transform:perspective(1300px) rotateX(0deg) translateY(0); opacity:1; }

/* wax seal */
.seal{
  position:absolute; top:-24px; left:50%; transform:translateX(-50%);
  width:56px; height:56px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e04a6e, #8f1d3d 70%, #6b1230);
  display:flex; align-items:center; justify-content:center;
  font-size:1.5rem; box-shadow:0 8px 20px rgba(0,0,0,0.45), inset 0 3px 8px rgba(255,255,255,0.25);
}
/* washi tape corners */
.tape{
  position:absolute; width:96px; height:28px;
  background:linear-gradient(90deg, rgba(245,221,176,0.75), rgba(217,176,106,0.55));
  box-shadow:0 3px 8px rgba(0,0,0,0.18);
}
.tape.tl{ top:-12px; left:-26px; transform:rotate(-38deg); }
.tape.br{ bottom:-12px; right:-26px; transform:rotate(-38deg); }

.letter-dear{
  font-family:'Great Vibes', cursive;
  font-size:clamp(2.1rem, 7vw, 3.2rem);
  color:#8f1d3d; text-align:center; margin-bottom:clamp(20px,4vw,34px);
  text-shadow:0 2px 6px rgba(217,176,106,0.35);
}
.letter-body{ font-family:'Dancing Script', cursive; font-size:clamp(1.15rem, 3.6vw, 1.55rem); line-height:2.05; text-align:left; }
.letter-line{ min-height:2.05em; opacity:0; transition:opacity .4s; }
.letter-line.typing, .letter-line.done{ opacity:1; }
.cursor{
  display:inline-block; width:2px; height:1.05em; margin-left:2px;
  background:#8f1d3d; vertical-align:-0.15em;
  animation:blink .8s step-end infinite;
}
@keyframes blink{ 50%{opacity:0;} }

/* glowing hearts orbiting the letter */
.orbit-heart{
  position:fixed; z-index:9; pointer-events:none;
  color:var(--pink); text-shadow:0 0 16px rgba(255,159,184,0.95);
  animation:orbitGlow 3.4s ease-in-out infinite;
}
@keyframes orbitGlow{
  0%,100%{ transform:scale(.8) translateY(0); opacity:.35; }
  50%{ transform:scale(1.25) translateY(-16px); opacity:1; }
}

/* ============================================================
   ❤️ SCENE 4 — FINAL HEART
   ============================================================ */
.final-heart{
  position:relative; width:clamp(120px, 32vw, 190px); height:clamp(110px, 30vw, 175px);
  animation:heartbeat 1.5s ease-in-out infinite;
  filter:drop-shadow(0 0 34px rgba(231,84,128,0.8));
}
.final-heart::before, .final-heart::after{
  content:''; position:absolute; top:0; width:52%; height:82%;
  background:linear-gradient(150deg, #ff7ba0, var(--rose) 55%, #b03060);
  border-radius:50% 50% 0 0;
  box-shadow:inset -6px -8px 22px rgba(120,10,50,0.4), inset 6px 8px 18px rgba(255,255,255,0.22);
}
.final-heart::before{ left:50%;  transform:rotate(-45deg); transform-origin:0 100%; }
.final-heart::after { left:0;     transform:rotate(45deg);  transform-origin:100% 100%; }
@keyframes heartbeat{
  0%,100%{ transform:scale(1); }
  14%{ transform:scale(1.14); }
  26%{ transform:scale(1); }
  40%{ transform:scale(1.1); }
  54%{ transform:scale(1); }
}

.final-line{
  font-family:'Great Vibes', cursive;
  font-size:clamp(1.9rem, 7vw, 3.4rem);
  background:linear-gradient(120deg, var(--pink-soft), var(--rose) 50%, var(--gold-light));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 20px rgba(231,84,128,0.5));
  opacity:0; transform:translateY(24px);
  transition:opacity 1.6s ease, transform 1.6s ease;
  margin-top:8px;
}
.final-line.show{ opacity:1; transform:none; }

/* ============================================================
   🎵 MUSIC BUTTON (fixed, all scenes)
   ============================================================ */
#music-btn{
  position:fixed; top:18px; right:18px; z-index:120;
  width:52px; height:52px; border-radius:50%;
  background:var(--glass); border:1px solid var(--glass-border);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  font-size:1.3rem; cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
  transition:transform .3s, box-shadow .3s;
  display:flex; align-items:center; justify-content:center;
}
#music-btn:hover{ transform:scale(1.1); box-shadow:0 0 24px rgba(217,176,106,0.5); }

@media (max-width:480px){
  .btn-glow{ padding:16px 38px; }
  .letter-paper{ max-height:78vh; }
}
</style>
</head>
<body>

<!-- ambient particle canvas (glowing dust + tiny hearts) -->
<canvas id="fx-canvas"></canvas>

<!-- 🎵 music toggle -->
<button id="music-btn" title="Music on/off">🔇</button>

<!-- ============================================================
     🔐 SCENE 1 — OPENING SCREEN
     ============================================================ -->
<section class="scene active" id="scene-intro">
  <p class="intro-kicker">With all my love</p>
  <h1 class="intro-title">A Little Surprise<br>For Reetha ❤️</h1>
  <p class="intro-sub">something made only for you…</p>
  <button class="btn-glow" id="open-gift-btn">Open Your Gift 🎁</button>
</section>

<!-- ============================================================
     🎁 SCENE 2 — GIFT BOX
     ============================================================ -->
<section class="scene" id="scene-gift">
  <div class="gift-stage">
    <div class="gift-halo"></div>
    <div class="gift-box" id="gift-box">
      <div class="gift-light"></div>
      <div class="gift-lid">
        <div class="lid-ribbon"></div>
        <div class="bow"><div class="bow-knot"></div></div>
      </div>
      <div class="gift-base">
        <div class="base-ribbon"></div>
      </div>
    </div>
  </div>
  <p class="gift-hint">tap the gift to open it 💝</p>
</section>

<!-- ============================================================
     💌 SCENE 3 — APOLOGY LETTER (lines injected by JS from CONFIG)
     ============================================================ -->
<section class="scene" id="scene-letter">
  <div class="letter-paper" id="letter-paper">
    <div class="tape tl"></div><div class="tape br"></div>
    <div class="seal">❤️</div>
    <h2 class="letter-dear" id="letter-heading"></h2>
    <div class="letter-body" id="letter-body"></div>
  </div>
</section>

<!-- ============================================================
     ❤️ SCENE 4 — FINAL SCENE
     ============================================================ -->
<section class="scene" id="scene-final">
  <div class="final-heart" style="margin-bottom:34px;"></div>
  <h2 class="final-line" id="final-1">I'm Sorry, Reetha ❤️</h2>
  <p class="final-line" id="final-2" style="font-size:clamp(1.4rem,5vw,2.2rem);">Please forgive me, my love.</p>
  <p class="final-line" id="final-3" style="font-size:clamp(1.2rem,4.4vw,1.9rem);">One heart. One love. One Reetha. ❤️</p>
</section>

<div class="flash" id="flash"></div>

<script>
/* ============================================================
   ✏️  CONFIG — customize everything here
   ============================================================ */
const CONFIG = {
  name: "Reetha",
  letterHeading: "Dear Reetha ❤️",
  letterLines: [
    "I know I hurt you, and I'm truly sorry.",
    "I never wanted to make you feel sad.",
    "You mean more to me than I can explain.",
    "I may make mistakes, but losing your smile is never what I want.",
    "Please forgive me, Reetha.",
    "I promise to understand, learn, and become better for us. ❤️"
  ],
  typeSpeed: 34,          // ms per character
  musicVolume: 0.5,       // overall music level (0–1)
  petalCount: 14          // falling rose petals during the letter
};

/* ============================================================
   🎵 MUSIC — romantic generative piano loop (Web Audio API)
   No audio file needed; plays soft chords + arpeggios.
   ============================================================ */
const Music = {
  ctx:null, master:null, delay:null, fb:null, wet:null,
  timer:null, step:0, nextTime:0, muted:true, level:CONFIG.musicVolume,

  NOTES:{ A2:110.00, F2:87.31, C3:130.81, G2:98.00,
          A3:220.00, C4:261.63, E4:329.63, F3:174.61, F4:349.23,
          G3:196.00, B3:246.94, D4:293.66, G4:392.00,
          A4:440.00, C5:523.25, D5:587.33, E5:659.25, B4:493.88 },
  // gentle Am → F → C → G progression (4 bars of 8 steps each)
  CHORDS:[
    { bass:'A2', arp:['A3','C4','E4','A4'], melody:['E5','C5'] },
    { bass:'F2', arp:['F3','A3','C4','F4'], melody:['C5','A4'] },
    { bass:'C3', arp:['C4','E4','G4','C5'], melody:['G4','E5'] },
    { bass:'G2', arp:['G3','B3','D4','G4'], melody:['D5','B4'] }
  ],
  STEP: 0.30, // seconds per eighth-note step

  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    const comp = this.ctx.createDynamicsCompressor();
    this.master.connect(comp); comp.connect(this.ctx.destination);
    // dreamy echo
    this.delay = this.ctx.createDelay(1.0); this.delay.delayTime.value = 0.34;
    this.fb = this.ctx.createGain(); this.fb.gain.value = 0.32;
    this.wet = this.ctx.createGain(); this.wet.gain.value = 0.30;
    this.delay.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(this.wet); this.wet.connect(this.master);
  },

  note(freq, time, dur, vol, type){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(this.master);
    const send = this.ctx.createGain(); send.gain.value = 0.6;
    g.connect(send); send.connect(this.delay);
    o.start(time); o.stop(time + dur + 0.1);
  },

  playStep(step, time){
    const chord = this.CHORDS[Math.floor(step / 8) % 4], i = step % 8;
    if(i === 0) this.note(this.NOTES[chord.bass], time, 2.4, 0.15, 'sine');      // warm bass
    this.note(this.NOTES[chord.arp[i % 4]], time, 1.3, 0.085, 'triangle');       // music-box arpeggio
    if(i === 3 || i === 6) this.note(this.NOTES[chord.melody[(step >> 3) % 2]], time, 1.8, 0.045, 'sine'); // soft melody bell
  },

  schedule(){ while(this.nextTime < this.ctx.currentTime + 0.6){ this.playStep(this.step, this.nextTime); this.step++; this.nextTime += this.STEP; } },

  start(){
    this.ensure(); this.ctx.resume();
    if(this.timer) return;
    this.step = 0; this.nextTime = this.ctx.currentTime + 0.15;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setTargetAtTime(this.muted ? 0 : this.level, this.ctx.currentTime, 1.0);
    this.timer = setInterval(() => this.schedule(), 100);
  },

  setLevel(v){ // smooth cinematic fade between scenes
    this.level = v;
    if(this.ctx && !this.muted) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 1.4);
  },

  toggle(){
    this.muted = !this.muted;
    if(this.ctx) this.master.gain.setTargetAtTime(this.muted ? 0 : this.level, this.ctx.currentTime, 0.35);
    return this.muted;
  }
};

/* ============================================================
   ✨ PARTICLE CANVAS — glowing dust + tiny drifting hearts
   ============================================================ */
const canvas = document.getElementById('fx-canvas'), cctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resizeCanvas); resizeCanvas();

for(let i = 0; i < 70; i++){
  particles.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: 0.8 + Math.random() * 2.2,
    vx: (Math.random() - .5) * .25, vy: -(.08 + Math.random() * .3),
    heart: Math.random() < .18, a: .15 + Math.random() * .5,
    tw: Math.random() * Math.PI * 2
  });
}
function drawHeart(x, y, s, color){
  cctx.save(); cctx.translate(x, y); cctx.scale(s, s);
  cctx.beginPath();
  cctx.moveTo(0, 3);
  cctx.bezierCurveTo(-4, -2, -8, 1, 0, 8);
  cctx.bezierCurveTo(8, 1, 4, -2, 0, 3);
  cctx.fillStyle = color; cctx.fill(); cctx.restore();
}
(function loopFX(){
  cctx.clearRect(0, 0, canvas.width, canvas.height);
  for(const p of particles){
    p.x += p.vx; p.y += p.vy; p.tw += 0.03;
    if(p.y < -20){ p.y = innerHeight + 20; p.x = Math.random() * innerWidth; }
    if(p.x < -20) p.x = innerWidth + 20; if(p.x > innerWidth + 20) p.x = -20;
    const glow = p.a * (0.6 + 0.4 * Math.sin(p.tw));
    if(p.heart) drawHeart(p.x, p.y, p.r * .8, `rgba(255,159,184,${glow})`);
    else {
      cctx.beginPath(); cctx.arc(p.x, p.y, p.r, 0, 7);
      cctx.fillStyle = `rgba(245,221,176,${glow})`;
      cctx.shadowColor = 'rgba(245,221,176,0.9)'; cctx.shadowBlur = 10;
      cctx.fill(); cctx.shadowBlur = 0;
    }
  }
  requestAnimationFrame(loopFX);
})();

/* ============================================================
   💗 AMBIENT FLOATING HEARTS — gentle hearts rising everywhere
   ============================================================ */
function spawnAmbientHeart(){
  const el = document.createElement('span');
  el.className = 'ambient-heart'; el.textContent = ['❤','💗','🤍'][Math.floor(Math.random()*3)];
  const size = 10 + Math.random() * 16;
  el.style.left = Math.random() * 100 + 'vw';
  el.style.fontSize = size + 'px';
  el.style.opacity = .2 + Math.random() * .5;
  el.style.animationDuration = (7 + Math.random() * 7) + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 15000);
}
setInterval(spawnAmbientHeart, 1900);

/* ============================================================
   🎬 SCENE MANAGER
   ============================================================ */
function showScene(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function flashScreen(){
  const f = document.getElementById('flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================
   🎵 music button
   ============================================================ */
const musicBtn = document.getElementById('music-btn');
let musicStarted = false;
musicBtn.addEventListener('click', () => {
  if(!musicStarted){ Music.start(); musicStarted = true; }
  musicBtn.textContent = Music.toggle() ? '🔇' : '🎵';
});

/* ============================================================
   🔐 SCENE 1 → SCENE 2 : begin the experience
   ============================================================ */
document.getElementById('open-gift-btn').addEventListener('click', () => {
  if(!musicStarted){ Music.start(); musicStarted = true; musicBtn.textContent = '🎵'; }
  Music.setLevel(0.40);                       // soft music for the gift moment
  showScene('scene-gift');
});

/* ============================================================
   🎁 SCENE 2 : gift opening — lid flies, hearts burst, flash
   ============================================================ */
const giftBox = document.getElementById('gift-box');
let giftOpened = false;

giftBox.addEventListener('click', () => {
  if(giftOpened) return; giftOpened = true;
  giftBox.classList.add('opened');

  // burst of hearts, sparkles and petals from the box
  const cx = innerWidth / 2, cy = innerHeight * 0.42;
  const icons = ['❤','💗','✦','🌸','❀','✨'];
  for(let i = 0; i < 48; i++){
    const el = document.createElement('span');
    el.className = 'burst-p';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    el.style.left = cx + 'px'; el.style.top = cy + 'px';
    el.style.fontSize = (14 + Math.random() * 24) + 'px';
    el.style.color = ['#ff9fb8','#e75480','#f5ddb0','#ffd1dc'][Math.floor(Math.random()*4)];
    const ang = Math.random() * Math.PI * 2, dist = 130 + Math.random() * Math.min(innerWidth * 0.45, 380);
    el.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--ty', (Math.sin(ang) * dist - 80) + 'px');
    el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    el.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }

  Music.setLevel(0.5);                         // lift the music as the magic happens
  setTimeout(flashScreen, 1150);               // cinematic flash
  setTimeout(() => { showScene('scene-letter'); startLetter(); }, 1700);
});

/* ============================================================
   💌 SCENE 3 : paper unfolds, then line-by-line typewriter
   ============================================================ */
function buildLetter(){
  document.getElementById('letter-heading').textContent = CONFIG.letterHeading;
  const body = document.getElementById('letter-body');
  body.innerHTML = '';
  CONFIG.letterLines.forEach(text => {
    const div = document.createElement('div');
    div.className = 'letter-line'; div.dataset.text = text;
    body.appendChild(div);
  });
}

function spawnPetals(){
  for(let i = 0; i < CONFIG.petalCount; i++){
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'petal-fall';
      const s = 12 + Math.random() * 14;
      p.style.width = s + 'px'; p.style.height = s + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.opacity = .45 + Math.random() * .4;
      p.style.animationDuration = (8 + Math.random() * 7) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 16000);
    }, i * 600);
  }
}

function orbitHearts(){
  const spots = [[8,22],[88,18],[12,72],[86,70],[50,6],[28,88],[74,88]];
  spots.forEach(([x, y], i) => {
    const h = document.createElement('span');
    h.className = 'orbit-heart'; h.textContent = '❤';
    h.style.left = x + 'vw'; h.style.top = y + 'vh';
    h.style.fontSize = (14 + (i % 3) * 8) + 'px';
    h.style.animationDelay = (i * 0.45) + 's';
    document.body.appendChild(h);
  });
}

async function startLetter(){
  buildLetter();
  Music.setLevel(0.55);

  const paper = document.getElementById('letter-paper');
  await sleep(400);
  paper.classList.add('unfolded');             // the paper unfolds
  spawnPetals();                               // rose petals begin to fall
  orbitHearts();                               // glowing hearts appear around it
  await sleep(1700);

  // ✍️ typewriter, line by line
  const lines = [...document.querySelectorAll('.letter-line')];
  const cursor = document.createElement('span'); cursor.className = 'cursor';
  for(const line of lines){
    line.classList.add('typing'); line.appendChild(cursor);
    for(const ch of line.dataset.text){
      cursor.before(document.createTextNode(ch));
      await sleep(CONFIG.typeSpeed);
    }
    line.classList.remove('typing'); line.classList.add('done');
    await sleep(450);                          // tender pause between lines
  }
  cursor.remove();

  // after the letter finishes → cinematic transition to the final scene
  await sleep(3200);
  flashScreen();
  setTimeout(showFinal, 600);
}

/* ============================================================
   ❤️ SCENE 4 : the beating heart & final words
   ============================================================ */
function showFinal(){
  showScene('scene-final');
  Music.setLevel(0.65);                        // fullest, warmest music
  // reveal each final line in sequence
  setTimeout(() => document.getElementById('final-1').classList.add('show'), 900);
  setTimeout(() => document.getElementById('final-2').classList.add('show'), 3400);
  setTimeout(() => document.getElementById('final-3').classList.add('show'), 5900);

  // the beating heart releases tiny floating hearts forever
  setInterval(() => {
    if(!document.getElementById('scene-final').classList.contains('active')) return;
    const h = document.createElement('span');
    h.textContent = ['❤','💗','🤍'][Math.floor(Math.random()*3)];
    h.style.cssText = `position:fixed;left:${44 + Math.random()*12}vw;top:48vh;z-index:9;
      font-size:${10 + Math.random()*14}px;color:var(--pink);
      text-shadow:0 0 12px rgba(255,159,184,.9);pointer-events:none;
      animation:floatUp ${5 + Math.random()*4}s ease-out forwards;`;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9500);
  }, 700);
}
</script>
